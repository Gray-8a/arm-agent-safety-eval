name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch MuJoCo Menagerie (panda only)
        run: |
          mkdir -p third_party
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          cd third_party/mujoco_menagerie
          git sparse-checkout set franka_emika_panda

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests (offline, no API key)
        run: python -m pytest -m "not live" -q

      - name: Case suite
        run: python scripts/run_suite.py --out reports/latest.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: reports/
